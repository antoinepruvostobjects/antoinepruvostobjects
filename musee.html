        " float rings=sin((p.x*.9+p.z*.9)*.22+warp*6.0);\n" +
        " float g=smoothstep(-.2,1.,rings)*.55+vn(vec3(p.x*.9,p.y*.06,p.z*.9))*.45;\n" +
        " float pores=vn(vec3(p.x*2.4,p.y*.22,p.z*2.4));\n" +
        " vec3 c=mix(uLight,uDark,clamp(g*.6+pores*.1,0.,1.));\n diffuseColor.rgb=c;\n}");
  };

const exhibits = []; // { def, group, inner, radius, lift }
function addExhibit(def, inner) {

  const box = new THREE.Box3().setFromObject(inner);

}
function loadHypar() {

function makeScreen(w, h) {

  function draw(dt) {
    t += dt; const W = cvs.width, H = cvs.height;
    if (Math.hypot(goal.x - cur.x, goal.y - cur.y) < 6) goal = { x: 240 + Math.random() * 680, y: 90 + Math.random() * (H - 200) };
    cur.x += (goal.x - cur.x) * Math.min(1, dt * 3); cur.y += (goal.y - cur.y) * Math.min(1, dt * 3);
    rot += dt * 0.25;
    ctx.fillStyle = "#2b2c30"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#3a3b40"; ctx.fillRect(0, 0, W, 34); ctx.fillStyle = "#4b4c52"; for (let i = 0; i < 14; i++) ctx.fillRect(14 + i * 34, 9, 22, 16);
    ctx.fillStyle = "#323338"; ctx.fillRect(0, 34, 200, H - 34);
    ctx.fillStyle = "#8c8d93"; ctx.font = "15px Helvetica, Arial, sans-serif";
    ["ANI_tabouret v12", "  Corps", "  Assise", "  Pieds (×3)", "  Inserts", "  Vis M6", "Esquisses", "Origine"].forEach((l, i) => ctx.fillText(l, 14, 64 + i * 26));
    // vue 3D : grille et tabouret en fil de fer qui tourne
    const vx = 200, vy = 34, vw = W - 200, vh = H - 34 - 54;
    const g = ctx.createLinearGradient(0, vy, 0, vy + vh); g.addColorStop(0, "#e9eaee"); g.addColorStop(1, "#c9cbd1"); ctx.fillStyle = g; ctx.fillRect(vx, vy, vw, vh);
    const cx = vx + vw / 2, cy = vy + vh * 0.62, S = vh * 0.5;
    const P = (x, y, z) => { const c = Math.cos(rot), s2 = Math.sin(rot), X = x * c - z * s2, Z = x * s2 + z * c; return [cx + X * S, cy - y * S + Z * S * 0.35]; };
    ctx.strokeStyle = "rgba(90,95,110,.25)"; ctx.lineWidth = 1;

    ctx.strokeStyle = "#2e6fd6"; ctx.lineWidth = 2;

    for (let k = 0; k < 3; k++) { const a = k / 3 * Math.PI * 2, f = P(Math.cos(a) * 0.42, 0, Math.sin(a) * 0.42), u = P(Math.cos(a) * 0.12, 0.88, Math.sin(a) * 0.12), m = P(Math.cos(a + 0.5) * 0.3, 0.5, Math.sin(a + 0.5) * 0.3);
      ctx.beginPath(); ctx.moveTo(f[0], f[1]); ctx.lineTo(u[0], u[1]); ctx.lineTo(m[0], m[1]); ctx.closePath(); ctx.stroke(); }

async function loadDesk() {

    const iAlu = new THREE.MeshStandardMaterial({ color: 0xc8ccd0, metalness: 0.6, roughness: 0.3, envMapIntensity: 1.8 });

  if (!zoom) return false;
  zoom.t = Math.min(1, zoom.t + dt / zoom.dur);
  const e = zoom.t < 0.5 ? 4 * zoom.t ** 3 : 1 - Math.pow(-2 * zoom.t + 2, 3) / 2;
  camera.position.lerpVectors(zoom.p0, zoom.p1, e);
  camera.lookAt(new THREE.Vector3().lerpVectors(zoom.l0, zoom.l1, e));
  if (zoom.t >= 1) { const f = zoom.done; zoom = null; setTimeout(f, 120); setTimeout(() => { frameAll(); }, 900); }
  return true;
}

/* ---------- Mise à l'échelle de l'écran ---------- */
function frameAll() {
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const span = Math.max(5.2, 3.6 / camera.aspect + 2); // largeur de sol à montrer, en mètres
  const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camDist = THREE.MathUtils.clamp((span / 2) / (halfH * camera.aspect), 12, 32);
  placeCamera();
}
function resize() { renderer.setSize(stage.clientWidth, stage.clientHeight, false); frameAll(); }
addEventListener("resize", resize);

/* ---------- Boucle ---------- */
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (hovered) { hoverT += dt; if (!hovered.isMe && hoverT > 0.9 && walker.target !== hovered && !walker.steps) walker.wanted = hovered; }
  if (deskParts.chair) {
    if (!walker.atDesk) { deskParts.out = THREE.MathUtils.damp(deskParts.out, 0, 3, dt); deskParts.swivel = THREE.MathUtils.damp(deskParts.swivel, 0, 3, dt); }
    deskParts.chair.position.z = deskParts.chairHome.z + deskParts.out; deskParts.chair.rotation.y = deskParts.swivel - 0.04;
  }
  if (deskParts.screen) { deskParts.screenOn = THREE.MathUtils.damp(deskParts.screenOn, deskParts.screenTarget, 2.5, dt); deskParts.screen.update(dt, deskParts.screenOn); }
  exhibits.forEach((e) => {
    if (e.isDesk && walker.atDesk) e.target = 0;
    e.lift = THREE.MathUtils.damp(e.lift, e.target, 7, dt);
    e.inner.position.y = e.baseY + e.lift * 0.09;
    e.inner.rotation.x = e.lift * 0.05; e.inner.rotation.z = -e.lift * 0.03;
  });
  updateWalker(dt);
  updateAvatar(dt);
  updateZoom(dt);
  sun.position.set(look.x - 2.6, 6.5, look.z + 3.2); sun.target.position.set(look.x, 0, look.z);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

Promise.all([loadAni(), loadHypar(), loadDesk(), loadAvatar()]).then(() => {
  exhibits.forEach((e) => (e.baseY = e.inner.position.y));
  resize();
  document.getElementById("load").classList.add("off");
  setTimeout(() => { document.getElementById("hint").style.opacity = "0"; }, 7000);
  loop();
});
</script>
